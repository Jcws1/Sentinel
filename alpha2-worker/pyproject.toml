[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-alpha2-worker"
version = "3.0.0-alpha.2"
requires-python = "==3.11.*"
dependencies = [
  "joblib==1.6.0",
  "numpy==2.4.6",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
  "threadpoolctl==3.7.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

