<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentinel Countermeasure Simulation</title><style>
*{box-sizing:border-box}body{margin:0;background:#071015;color:#d9e8ee;font:14px Inter,Segoe UI,sans-serif}header{height:58px;border-bottom:1px solid #23343c;display:flex;align-items:center;padding:0 22px;gap:18px;background:#0b151b}h1{font-size:15px;margin:0}.tag{color:#7ad9f5;border:1px solid #24566a;padding:5px 9px;border-radius:4px}.grid{display:grid;grid-template-columns:2fr 1fr;height:calc(100vh - 58px)}main{position:relative;border-right:1px solid #23343c;background:radial-gradient(circle at 50% 45%,#132933,#071015 65%)}canvas{width:100%;height:100%}.legend{position:absolute;left:18px;bottom:18px;background:#09151cdd;border:1px solid #294451;padding:12px;line-height:1.7}.panel{padding:18px;overflow:auto}h2{font-size:12px;letter-spacing:.14em;color:#8fa5af}.card{background:#111e25;border:1px solid #29414c;border-left:3px solid #57cae9;padding:15px;margin:12px 0}.code{font-size:12px;color:#7ad9f5;font-weight:700}.summary{font-size:16px;line-height:1.5;margin:10px 0}.meta{color:#91a5ae;font-size:12px;line-height:1.6}button{background:#78d5eb;color:#061116;border:0;padding:11px 16px;font-weight:700;cursor:pointer;margin-right:8px}button.secondary{background:#182830;color:#b7c8cf;border:1px solid #37515e}.event{padding:8px 0;border-bottom:1px solid #1d3039;color:#a9bcc5}.ok{color:#79e0ad}.warn{color:#ffd177}</style></head><body>
<header><h1>SENTINEL · REAL-TIME COUNTERMEASURE DEMO</h1><span class="tag">SIMULATION ONLY</span><span id="phase"></span></header><div class="grid"><main><canvas id="map"></canvas><div class="legend">◆ inbound simulated track<br>□ simulated interceptor<br><span class="warn">Operator confirmation is mandatory</span></div></main><aside class="panel"><h2>DECISION SUPPORT</h2><div id="recommendation"></div><h2>AUDIT TRAIL</h2><div id="audit"></div></aside></div><script>
let state,anim=0;const $=s=>document.querySelector(s);async function load(){state=await (await fetch('/api/state')).json();render()}async function reset(){state=await (await fetch('/api/reset',{method:'POST'})).json();anim=0;render()}async function confirm(){const r=await fetch('/api/confirm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({recommendationId:state.recommendation.id,expectedRevision:state.revision})});state=await r.json();anim=0;animate()}
function render(){if(!state)return;$('#phase').textContent=state.phase.toUpperCase();let rec=state.recommendation;$('#recommendation').innerHTML=`<div class="card"><div class="code">${rec.category.toUpperCase()} · ${rec.code}</div><div class="summary">${rec.summary}</div><div class="meta">Target: ${rec.targetId}<br>Asset: ${rec.interceptorId}<br>Evidence: ${rec.evidenceIds.join(', ')}<br>World revision: ${state.revision}</div><p>${state.outcome?'<b class="ok">AUTHORITATIVE SIMULATED OUTCOME: INTERCEPTED</b>':'Requires explicit operator confirmation.'}</p>${state.outcome?'<button class="secondary" onclick="reset()">Reset simulation</button>':`<button onclick="confirm()">Confirm simulated tasking</button><button class="secondary" onclick="reset()">Cancel / reset</button>`}</div>`;$('#audit').innerHTML=state.audit.map(x=>`<div class="event"><b>${x.event.replaceAll('_',' ')}</b><br><span class="meta">${JSON.stringify(x)}</span></div>`).join('');draw(state.interceptor,state.target)}
function draw(i,t){const c=$('#map'),d=devicePixelRatio||1;c.width=c.clientWidth*d;c.height=c.clientHeight*d;const x=c.getContext('2d');x.scale(d,d);const w=c.clientWidth,h=c.clientHeight;x.strokeStyle='#17313c';for(let n=0;n<w;n+=50){x.beginPath();x.moveTo(n,0);x.lineTo(n,h);x.stroke()}for(let n=0;n<h;n+=50){x.beginPath();x.moveTo(0,n);x.lineTo(w,n);x.stroke()}const p=a=>[80+a[0]/1100*(w-160),h/2-a[1]/500*h*.7];let [ix,iy]=p(i),[tx,ty]=p(t);x.strokeStyle='#3e7488';x.setLineDash([6,6]);x.beginPath();x.moveTo(ix,iy);x.lineTo(tx,ty);x.stroke();x.setLineDash([]);x.fillStyle='#72d9f2';x.fillRect(ix-7,iy-7,14,14);x.fillStyle='#ff756f';x.beginPath();x.moveTo(tx,ty-10);x.lineTo(tx+9,ty+8);x.lineTo(tx-9,ty+8);x.fill();x.fillStyle='#c6d8df';x.fillText('SIM-INTERCEPTOR-1',ix+13,iy);x.fillText('SIM-TARGET-1',tx+13,ty)}
function animate(){if(!state.path||anim>=state.path.length){render();return}let s=state.path[anim];draw(s.interceptor,s.target);$('#phase').textContent='INTERCEPT IN PROGRESS';anim+=Math.max(1,Math.floor(state.path.length/90));requestAnimationFrame(animate)}load();</script></body></html>
